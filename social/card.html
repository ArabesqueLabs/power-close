<!doctype html>
<!-- The social card (Open Graph, X): 1200x630, the hero in small: the claim
     at the start, the popup at the end, over the system's texture. English,
     or Arabic with ?lang=ar. Rendered to website/img/social/ by
     social/render.mjs, from the repository's root. -->
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Social card</title>
  <link rel="stylesheet" href="../website/vendor/arabesque/fonts/fonts.css">
  <link rel="stylesheet" href="fonts/fonts-ar.css">
  <link rel="stylesheet" href="../website/vendor/arabesque/dist/arabesque.css">
  <style>
    html, body { margin: 0; inline-size: 1200px; block-size: 630px; overflow: hidden; }
    .card {
      position: relative;
      box-sizing: border-box;
      inline-size: 1200px;
      block-size: 630px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 64px;
      align-items: center;
      padding: 64px 72px;
    }
    .card .al-pattern__art { position: absolute; inset: 0; }
    .card > * { position: relative; }
    .card__text { display: flex; flex-direction: column; justify-content: space-between; block-size: 100%; }
    .card .al-lockup { font-size: 32px; gap: 16px; }
    .card .al-mark { inline-size: 52px; block-size: 52px; }
    .pc-mark {
      display: inline-block;
      background: currentColor;
      -webkit-mask: url("../website/img/mark.svg") center / contain no-repeat;
      mask: url("../website/img/mark.svg") center / contain no-repeat;
    }
    .card h1 { margin: 0; font-size: 72px; line-height: 1.05; text-wrap: balance; }
    :lang(ar) .card h1 { font-size: 60px; line-height: 1.4; }
    .card__foot { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 26px; color: var(--al-color-text-muted); }
    .card__foot strong { font-weight: var(--al-weight-medium); color: var(--al-color-text); }
    .card__shot {
      margin: 0;
      inline-size: 420px;
      border: 1px solid var(--al-color-line-strong);
      border-radius: var(--al-radius-sm);
      background: var(--al-color-bg);
      overflow: hidden;
      box-shadow: 0 24px 48px -24px rgb(0 0 0 / 0.25);
    }
    .card__shot img { display: block; inline-size: 100%; block-size: auto; }
  </style>
</head>
<body>
  <section class="al-pattern card">
    <div class="al-pattern__art" aria-hidden="true" data-pattern></div>
    <div class="card__text">
      <span class="al-lockup"><span class="al-mark pc-mark" aria-hidden="true"></span><bdi class="al-wordmark" lang="en">Power Close</bdi></span>
      <h1 class="al-display" data-title></h1>
      <p class="card__foot"><strong data-tagline></strong><bdi lang="en">power-close.com</bdi></p>
    </div>
    <figure class="card__shot"><img src="../website/screenshots/popup-light.png" width="640" height="680" alt=""></figure>
  </section>
  <script type="module">
    import { drawPattern } from "../website/vendor/arabesque/js/pattern.js";
    const words = {
      en: { title: "Close every tab that matches, at once.", tagline: "Free, for Chrome and Firefox." },
      ar: { title: "أغلق كل التبويبات المطابقة، دفعة واحدة.", tagline: "مجانية، لكروم وفايرفوكس." },
    };
    const lang = new URLSearchParams(location.search).get("lang") === "ar" ? "ar" : "en";
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelector("[data-title]").textContent = words[lang].title;
    document.querySelector("[data-tagline]").textContent = words[lang].tagline;
    await document.fonts.ready;
    await document.querySelector(".card__shot img").decode();
    drawPattern(document.querySelector("[data-pattern]"));
    document.body.dataset.ready = "";
  </script>
</body>
</html>
